openapi: 3.0.0
info:
  title: Task Management API (Modular)
  description: API collection for the Laravel 11 Modular Task Management System
  version: 1.0.0
servers:
  - url: http://localhost:8000/api
    description: Local Server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /register:
    post:
      tags:
        - Auth
      summary: Register
      security: [] # No authentication required for this endpoint
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  example: john@example.com
                password:
                  type: string
                  example: password
      responses:
        '200':
          description: Successfully registered
  /login:
    post:
      tags:
        - Auth
      summary: Login
      security: [] # No authentication required for this endpoint
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: john@example.com
                password:
                  type: string
                  example: password
      responses:
        '200':
          description: Successfully logged in
  /logout:
    post:
      tags:
        - Auth
      summary: Logout
      responses:
        '200':
          description: Successfully logged out
  /projects:
    get:
      tags:
        - Projects
      summary: List Projects
      parameters:
        - name: per_page
          in: query
          schema:
            type: string
            example: "15"
        - name: sort_by
          in: query
          schema:
            type: string
            example: created_at
        - name: sort_order
          in: query
          schema:
            type: string
            example: desc
      responses:
        '200':
          description: A list of projects
    post:
      tags:
        - Projects
      summary: Create Project
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: New Project
                description:
                  type: string
                  example: Project description
                status:
                  type: string
                  example: Active
      responses:
        '201':
          description: Project created successfully
  /projects/{id}:
    get:
      tags:
        - Projects
      summary: View Project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details
    put:
      tags:
        - Projects
      summary: Update Project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Updated Project
                status:
                  type: string
                  example: Completed
      responses:
        '200':
          description: Project updated successfully
    delete:
      tags:
        - Projects
      summary: Delete Project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project deleted successfully
  /tasks:
    get:
      tags:
        - Tasks
      summary: List Tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            example: Todo
        - name: priority
          in: query
          schema:
            type: string
            example: High
      responses:
        '200':
          description: A list of tasks
    post:
      tags:
        - Tasks
      summary: Create Task
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                  example: "1"
                title:
                  type: string
                  example: New Task
                description:
                  type: string
                  example: Task description
                priority:
                  type: string
                  example: High
                status:
                  type: string
                  example: Todo
                due_date:
                  type: string
                  format: date
                  example: "2026-12-31"
      responses:
        '201':
          description: Task created successfully
  /tasks/{id}:
    get:
      tags:
        - Tasks
      summary: View Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task details
    put:
      tags:
        - Tasks
      summary: Update Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: In Progress
      responses:
        '200':
          description: Task updated successfully
    delete:
      tags:
        - Tasks
      summary: Delete Task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task deleted successfully
  /dashboard:
    get:
      tags:
        - Dashboard
      summary: Get Dashboard Stats
      responses:
        '200':
          description: Dashboard summary statistics